name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  swift-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: swiftc -parse-as-library -O -o build/ProviderModelPicker src/ProviderModelPicker.swift
